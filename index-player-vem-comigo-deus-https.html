<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#071a33">
<title>Web Rádio Vem Comigo Deus</title>
<style>
:root {
  --bg:#071a33;
  --panel:#0e2a4e;
  --panel2:#123760;
  --gold:#F9B800;
  --gold2:#FFD85A;
  --white:#fff;
  --muted:#a9b7c9;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#123760 0,#071a33 42%,#04101f 100%);font-family:Arial,sans-serif;color:#fff}
body{display:grid;place-items:center;padding:20px}
.player-card{
  width:min(94vw,430px);
  background:linear-gradient(180deg,rgba(18,55,96,.97),rgba(8,30,57,.98));
  border:1px solid rgba(249,184,0,.32);
  border-radius:28px;
  box-shadow:0 24px 70px rgba(0,0,0,.45);
  overflow:hidden;
}
.hero{padding:28px 24px 18px;text-align:center}
.logo{
  width:110px;height:110px;border-radius:50%;margin:0 auto 18px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#071a33;font-weight:900;font-size:34px;
  box-shadow:0 0 0 7px rgba(249,184,0,.08),0 0 40px rgba(249,184,0,.22)
}
h1{margin:0;color:var(--gold);font-size:24px;line-height:1.15}
.subtitle{margin-top:8px;color:var(--muted);font-size:13px}
.live{
  display:inline-flex;align-items:center;gap:7px;margin-top:15px;
  padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.06);
  color:#fff;font-size:12px;font-weight:700
}
.dot{width:8px;height:8px;border-radius:50%;background:#ff3b30;box-shadow:0 0 12px #ff3b30}
.now{padding:0 24px 14px}
.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.program{font-size:18px;font-weight:800;margin-top:5px}
.status{font-size:13px;color:var(--muted);margin-top:3px}
.visualizer{
  height:68px;margin:4px 24px 18px;padding:8px 10px;
  background:rgba(0,0,0,.18);border-radius:16px;
  display:flex;align-items:flex-end;justify-content:center;gap:4px;
  overflow:hidden
}
.bar{width:7px;min-height:6px;border-radius:7px;background:linear-gradient(180deg,#5ee7ff,#6a8cff,#d96cff,#ffd54f);height:14px;transition:.15s}
.visualizer.playing .bar{animation:bounce 1s ease-in-out infinite alternate}
.visualizer .bar:nth-child(2n){animation-duration:.65s}
.visualizer .bar:nth-child(3n){animation-duration:.85s}
.visualizer .bar:nth-child(4n){animation-duration:1.15s}
@keyframes bounce{from{height:10px}to{height:52px}}
.controls{display:flex;align-items:center;justify-content:center;gap:18px;padding:0 24px 22px}
.play{
  width:72px;height:72px;border:0;border-radius:50%;cursor:pointer;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#071a33;
  font-size:28px;font-weight:900;box-shadow:0 9px 28px rgba(249,184,0,.25)
}
.small{
  width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.05);color:#fff;font-size:18px;cursor:pointer
}
.volume{padding:0 24px 22px;display:flex;align-items:center;gap:10px}
input[type=range]{width:100%;accent-color:var(--gold)}
.footer{
  border-top:1px solid rgba(255,255,255,.08);
  padding:14px 18px;text-align:center;font-size:11px;color:var(--muted)
}
.error{color:#ffb6b6}
.ok{color:#baf4c7}
@media(max-width:420px){
  body{padding:10px}
  .player-card{border-radius:22px}
  .hero{padding-top:22px}
}
</style>
</head>
<body>
<main class="player-card">
  <section class="hero">
    <div class="logo">VC</div>
    <h1>Web Rádio<br>Vem Comigo Deus</h1>
    <div class="subtitle">Louvor, Palavra e Fé 24 horas</div>
    <div class="live"><span class="dot"></span> AO VIVO</div>
  </section>

  <section class="now">
    <div class="label">Agora na rádio</div>
    <div class="program">Web Rádio Vem Comigo Deus</div>
    <div id="status" class="status">Pronta para tocar</div>
  </section>

  <div id="visualizer" class="visualizer">
    <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
  </div>

  <section class="controls">
    <button id="muteBtn" class="small" title="Som">🔊</button>
    <button id="playBtn" class="play" title="Ouvir">▶</button>
    <button id="reloadBtn" class="small" title="Reconectar">↻</button>
  </section>

  <section class="volume">
    <span>🔈</span>
    <input id="volume" type="range" min="0" max="1" step="0.01" value="0.9">
    <span>🔊</span>
  </section>

  <div class="footer">Player oficial • Vem Comigo Deus</div>
</main>

<audio id="radio" preload="none" playsinline crossorigin="anonymous">
  <source src="https://stream-vem-comigo-deus.onrender.com/radio" type="audio/mpeg">
</audio>

<script>
const radio = document.getElementById('radio');
const playBtn = document.getElementById('playBtn');
const muteBtn = document.getElementById('muteBtn');
const reloadBtn = document.getElementById('reloadBtn');
const volume = document.getElementById('volume');
const statusEl = document.getElementById('status');
const visualizer = document.getElementById('visualizer');

radio.volume = Number(volume.value);

async function tocar() {
  try {
    statusEl.textContent = 'Conectando ao sinal...';
    await radio.play();
    playBtn.textContent = '❚❚';
    visualizer.classList.add('playing');
    statusEl.textContent = 'Transmitindo ao vivo';
    statusEl.className = 'status ok';
  } catch (e) {
    statusEl.textContent = 'Não foi possível iniciar. Toque novamente.';
    statusEl.className = 'status error';
  }
}

function parar() {
  radio.pause();
  playBtn.textContent = '▶';
  visualizer.classList.remove('playing');
  statusEl.textContent = 'Pausado';
  statusEl.className = 'status';
}

playBtn.addEventListener('click', () => {
  if (radio.paused) tocar(); else parar();
});

muteBtn.addEventListener('click', () => {
  radio.muted = !radio.muted;
  muteBtn.textContent = radio.muted ? '🔇' : '🔊';
});

volume.addEventListener('input', () => {
  radio.volume = Number(volume.value);
  if (radio.volume > 0) {
    radio.muted = false;
    muteBtn.textContent = '🔊';
  }
});

reloadBtn.addEventListener('click', async () => {
  const estavaTocando = !radio.paused;
  radio.load();
  if (estavaTocando) await tocar();
  else {
    statusEl.textContent = 'Sinal recarregado';
    statusEl.className = 'status';
  }
});

radio.addEventListener('waiting', () => {
  statusEl.textContent = 'Reconectando...';
  statusEl.className = 'status';
});
radio.addEventListener('playing', () => {
  statusEl.textContent = 'Transmitindo ao vivo';
  statusEl.className = 'status ok';
  visualizer.classList.add('playing');
});
radio.addEventListener('error', () => {
  statusEl.textContent = 'Sinal indisponível no momento';
  statusEl.className = 'status error';
  visualizer.classList.remove('playing');
  playBtn.textContent = '▶';
});
</script>
</body>
</html>
